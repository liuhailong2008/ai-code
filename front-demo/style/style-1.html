<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingMesh — 数据中心网络监控平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="themes.css">
<style>
/* ========== 全局重置与变量 ========== */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2235;
  --bg-card-hover: #1f2b42;
  --border-color: #1e2a3f;
  --border-light: #2a3650;
  --text-primary: #e8ecf4;
  --text-secondary: #8b9ab8;
  --text-muted: #5a6a85;
  --accent-blue: #3b82f6;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-yellow: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #8b5cf6;
  --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
  --shadow-md: 0 4px 16px rgba(0,0,0,.35);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-width: 240px;
  --header-height: 64px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== 布局 ========== */
.app { display:flex; min-height:100vh; }

/* ---------- 侧边栏 ---------- */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0; left:0; bottom:0;
  z-index:100;
  transition: transform .3s ease;
}
.sidebar-logo {
  height: var(--header-height);
  display:flex;
  align-items:center;
  padding: 0 20px;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink:0;
}
.sidebar-logo .logo-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  border-radius: 10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:800; color:#fff;
  letter-spacing: -1px;
}
.sidebar-logo .logo-text {
  font-size:18px; font-weight:700;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
.nav-section-title {
  font-size:11px; text-transform:uppercase;
  color: var(--text-muted); letter-spacing: 1.5px;
  padding: 12px 12px 8px; font-weight:600;
}
.nav-item {
  display:flex; align-items:center; gap:12px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  cursor:pointer; transition: all .2s ease;
  color: var(--text-secondary); font-size:14px; font-weight:500;
  margin-bottom: 2px;
  user-select:none;
}
.nav-item:hover { background: rgba(59,130,246,.08); color: var(--text-primary); }
.nav-item.active {
  background: rgba(59,130,246,.15); color: var(--accent-cyan);
  box-shadow: inset 3px 0 0 var(--accent-cyan);
}
.nav-item .nav-icon { width:20px; text-align:center; font-size:16px; }
.nav-badge {
  margin-left:auto; background: var(--accent-red);
  color:#fff; font-size:11px; font-weight:700;
  padding: 2px 7px; border-radius: 10px; min-width:20px; text-align:center;
}

/* ---------- 主区域 ---------- */
.main { flex:1; margin-left: var(--sidebar-width); display:flex; flex-direction:column; min-height:100vh; }

/* ---------- 顶栏 ---------- */
.header {
  height: var(--header-height);
  background: rgba(17,24,39,.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 28px; position:sticky; top:0; z-index:50;
  flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:16px; }
.menu-toggle {
  display:none; width:36px; height:36px;
  border:1px solid var(--border-light); border-radius:var(--radius-sm);
  background:transparent; color:var(--text-secondary); font-size:18px;
  cursor:pointer; align-items:center; justify-content:center;
}
.breadcrumb { font-size:13px; color:var(--text-muted); }
.breadcrumb span { color:var(--text-primary); font-weight:600; }
.header-right { display:flex; align-items:center; gap:16px; }
.search-box {
  display:flex; align-items:center; gap:8px;
  background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:var(--radius-sm); padding: 8px 14px;
  width:260px; transition: border-color .2s;
}
.search-box:focus-within { border-color: var(--accent-blue); }
.search-box input {
  background:transparent; border:none; outline:none;
  color:var(--text-primary); font-size:13px; width:100%;
}
.search-box input::placeholder { color: var(--text-muted); }
.header-btn {
  width:36px; height:36px; border-radius:var(--radius-sm);
  border:1px solid var(--border-color); background:var(--bg-card);
  color:var(--text-secondary); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; transition: all .2s; position:relative;
}
.header-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.header-btn .dot {
  position:absolute; top:7px; right:7px;
  width:8px; height:8px; background:var(--accent-red);
  border-radius:50%; border:2px solid var(--bg-card);
}
.user-avatar {
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent-purple),var(--accent-blue));
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; cursor:pointer;
}

/* ---------- 内容区 ---------- */
.content { padding: 24px 28px; flex:1; }

/* 页面标题行 */
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.page-title { font-size:22px; font-weight:700; }
.page-subtitle { font-size:13px; color:var(--text-muted); margin-top:4px; }
.page-actions { display:flex; gap:10px; }
.btn {
  padding: 9px 18px; border-radius:var(--radius-sm); font-size:13px;
  font-weight:600; cursor:pointer; border:none; display:inline-flex;
  align-items:center; gap:8px; transition: all .2s;
}
.btn-primary { background: linear-gradient(135deg, var(--accent-blue), #2563eb); color:#fff; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.35); }
.btn-outline {
  background:transparent; color:var(--text-secondary);
  border:1px solid var(--border-light);
}
.btn-outline:hover { border-color: var(--accent-blue); color: var(--text-primary); }

/* ---------- 统计卡片 ---------- */
.stats-row { display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; margin-bottom:24px; }
.stat-card {
  background: var(--bg-card); border:1px solid var(--border-color);
  border-radius: var(--radius); padding: 22px; position:relative;
  overflow:hidden; transition: all .3s ease;
}
.stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card::after {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.stat-card.blue::after   { background: linear-gradient(90deg, var(--accent-blue), #60a5fa); }
.stat-card.cyan::after    { background: linear-gradient(90deg, var(--accent-cyan), #22d3ee); }
.stat-card.green::after   { background: linear-gradient(90deg, var(--accent-green), #34d399); }
.stat-card.red::after     { background: linear-gradient(90deg, var(--accent-red), #f87171); }
.stat-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.stat-label { font-size:13px; color:var(--text-secondary); font-weight:500; }
.stat-icon {
  width:40px; height:40px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.stat-card.blue .stat-icon   { background: rgba(59,130,246,.15); color: var(--accent-blue); }
.stat-card.cyan .stat-icon    { background: rgba(6,182,212,.15); color: var(--accent-cyan); }
.stat-card.green .stat-icon   { background: rgba(16,185,129,.15); color: var(--accent-green); }
.stat-card.red .stat-icon     { background: rgba(239,68,68,.15); color: var(--accent-red); }
.stat-value { font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1; margin-bottom:8px; }
.stat-footer { display:flex; align-items:center; gap:6px; font-size:12px; }
.trend-up { color: var(--accent-green); }
.trend-down { color: var(--accent-red); }
.trend-neutral { color: var(--text-muted); }

/* ---------- 图表网格 ---------- */
.charts-grid { display:grid; grid-template-columns: 2fr 1fr; gap:20px; margin-bottom:24px; }
.card {
  background: var(--bg-card); border:1px solid var(--border-color);
  border-radius: var(--radius); overflow:hidden;
}
.card-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 22px; border-bottom:1px solid var(--border-color);
}
.card-title { font-size:15px; font-weight:600; }
.card-actions { display:flex; gap:6px; }
.card-tab {
  padding: 5px 12px; border-radius:6px; font-size:12px; font-weight:600;
  cursor:pointer; color:var(--text-muted); background:transparent; border:none;
  transition: all .2s;
}
.card-tab.active { background: rgba(59,130,246,.15); color: var(--accent-cyan); }
.card-body { padding: 20px 22px; }
.chart-container { position:relative; height:280px; }

/* ---------- 拓扑图 ---------- */
.topology-container { position:relative; height:320px; }
#topologyCanvas { width:100%; height:100%; }

/* ---------- 表格 + 警报双列 ---------- */
.bottom-grid { display:grid; grid-template-columns: 1.6fr 1fr; gap:20px; }

/* 数据表格 */
.data-table { width:100%; border-collapse:collapse; }
.data-table thead th {
  text-align:left; padding: 12px 16px; font-size:12px;
  font-weight:600; color:var(--text-muted); text-transform:uppercase;
  letter-spacing:.5px; border-bottom:1px solid var(--border-color);
  white-space:nowrap;
}
.data-table tbody tr { transition: background .15s; }
.data-table tbody tr:hover { background: rgba(59,130,246,.04); }
.data-table td {
  padding: 14px 16px; font-size:13px; border-bottom:1px solid var(--border-color);
  color: var(--text-secondary);
}
.node-name { color:var(--text-primary); font-weight:600; }
.status-dot {
  display:inline-flex; align-items:center; gap:6px;
}
.status-dot .dot {
  width:8px; height:8px; border-radius:50%;
  animation: pulse-dot 2s infinite;
}
.status-dot.online .dot { background: var(--accent-green); box-shadow: 0 0 8px rgba(16,185,129,.5); }
.status-dot.warning .dot { background: var(--accent-yellow); box-shadow: 0 0 8px rgba(245,158,11,.5); }
.status-dot.offline .dot { background: var(--accent-red); box-shadow: 0 0 8px rgba(239,68,68,.5); }
.latency-bar {
  display:flex; align-items:center; gap:8px;
}
.latency-bar-track {
  width:80px; height:6px; background:var(--bg-secondary);
  border-radius:3px; overflow:hidden;
}
.latency-bar-fill { height:100%; border-radius:3px; transition: width .5s; }
.loss-tag {
  padding: 3px 10px; border-radius:12px; font-size:12px; font-weight:600;
}
.loss-low { background: rgba(16,185,129,.15); color: var(--accent-green); }
.loss-med { background: rgba(245,158,11,.15); color: var(--accent-yellow); }
.loss-high { background: rgba(239,68,68,.15); color: var(--accent-red); }
.region-tag {
  padding: 3px 10px; border-radius:6px; font-size:11px; font-weight:600;
  background: rgba(139,92,246,.12); color: var(--accent-purple);
}

/* ---------- 警报列表 ---------- */
.alert-list { max-height:420px; overflow-y:auto; }
.alert-item {
  display:flex; gap:14px; padding: 16px 22px;
  border-bottom:1px solid var(--border-color);
  transition: background .15s; cursor:pointer;
}
.alert-item:hover { background: rgba(239,68,68,.04); }
.alert-item:last-child { border-bottom:none; }
.alert-severity {
  width:10px; height:10px; border-radius:50%;
  flex-shrink:0; margin-top:5px;
}
.alert-severity.critical { background: var(--accent-red); box-shadow: 0 0 10px rgba(239,68,68,.6); }
.alert-severity.warning { background: var(--accent-yellow); box-shadow: 0 0 10px rgba(245,158,11,.5); }
.alert-severity.info { background: var(--accent-blue); box-shadow: 0 0 10px rgba(59,130,246,.5); }
.alert-content { flex:1; min-width:0; }
.alert-title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:4px; }
.alert-desc { font-size:12px; color:var(--text-muted); line-height:1.5; }
.alert-time { font-size:11px; color:var(--text-muted); white-space:nowrap; margin-top:6px; }

/* ---------- 动画 ========== */
@keyframes pulse-dot {
  0%, 100% { opacity:1; }
  50% { opacity:.4; }
}
@keyframes fadeInUp {
  from { opacity:0; transform: translateY(16px); }
  to { opacity:1; transform: translateY(0); }
}
.animate-in { animation: fadeInUp .5s ease forwards; }
.delay-1 { animation-delay: .1s; opacity:0; }
.delay-2 { animation-delay: .2s; opacity:0; }
.delay-3 { animation-delay: .3s; opacity:0; }
.delay-4 { animation-delay: .4s; opacity:0; }
.delay-5 { animation-delay: .5s; opacity:0; }

/* ---------- 响应式 ---------- */
@media (max-width:1200px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .bottom-grid { grid-template-columns: 1fr; }
}
@media (max-width:768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left:0; }
  .menu-toggle { display:flex; }
  .search-box { display:none; }
  .stats-row { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .page-header { flex-direction:column; align-items:flex-start; gap:12px; }
}
</style>
</head>
<body>

<div class="app">

<!-- ==================== 侧边栏 ==================== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">P</div>
    <div class="logo-text">PingMesh</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-title">总览</div>
    <div class="nav-item active"><span class="nav-icon">&#9632;</span> 监控面板</div>
    <div class="nav-item"><span class="nav-icon">&#9733;</span> 网络拓扑</div>

    <div class="nav-section-title">分析</div>
    <div class="nav-item"><span class="nav-icon">&#9783;</span> 延迟分析</div>
    <div class="nav-item"><span class="nav-icon">&#9830;</span> 丢包统计</div>
    <div class="nav-item"><span class="nav-icon">&#9776;</span> 报表中心</div>

    <div class="nav-section-title">管理</div>
    <div class="nav-item"><span class="nav-icon">&#9678;</span> 节点管理</div>
    <div class="nav-item"><span class="nav-icon">&#9881;</span> 探针配置</div>
    <div class="nav-item"><span class="nav-icon">&#9888;</span> 告警规则<span class="nav-badge">3</span></div>

    <div class="nav-section-title">系统</div>
    <div class="nav-item"><span class="nav-icon">&#9681;</span> 系统设置</div>
  </nav>
</aside>

<!-- ==================== 主区域 ==================== -->
<div class="main">

  <!-- 顶栏 -->
  <header class="header">
    <div class="header-left">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div class="breadcrumb">监控面板 <span>/ Dashboard</span></div>
    </div>
  <div class="header-right">
    <div class="search-box">
      <span>&#128269;</span>
      <input type="text" placeholder="搜索节点、告警、IP...">
    </div>
    <button class="header-btn">&#128276;<span class="dot"></span></button>
    <button class="header-btn">&#9881;</button>
    <div class="user-avatar">管</div>
    <div class="theme-switcher" style="display:flex; align-items:center; gap:6px; margin-left:8px;">
      <span style="font-size:12px; color:var(--text-muted);">主题</span>
      <button class="theme-btn" data-theme="minimal" title="极简">极简</button>
      <button class="theme-btn" data-theme="neo" title="复古未来">Neo</button>
      <button class="theme-btn" data-theme="industrial" title="工业">Industrial</button>
    </div>
  </div>
</header>

  <!-- 内容 -->
  <main class="content">

    <!-- 页面标题 -->
    <div class="page-header animate-in">
      <div>
        <div class="page-title">网络监控概览</div>
        <div class="page-subtitle">实时监控数据中心间网络质量 · 最后更新: <span id="lastUpdate">--</span></div>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline">&#8635; 刷新数据</button>
        <button class="btn btn-primary">&#43; 新增探针</button>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stat-card blue animate-in delay-1">
        <div class="stat-header">
          <span class="stat-label">在线节点</span>
          <div class="stat-icon">&#9678;</div>
        </div>
        <div class="stat-value" id="statNodes">128</div>
        <div class="stat-footer trend-up">&#9650; 较昨日 +3 (2.4%)</div>
      </div>
      <div class="stat-card cyan animate-in delay-2">
        <div class="stat-header">
          <span class="stat-label">平均延迟</span>
          <div class="stat-icon">&#9783;</div>
        </div>
        <div class="stat-value" id="statLatency">0.42<span style="font-size:16px;color:var(--text-muted)">ms</span></div>
        <div class="stat-footer trend-neutral">&#9472; 与昨日持平</div>
      </div>
      <div class="stat-card green animate-in delay-3">
        <div class="stat-header">
          <span class="stat-label">丢包率</span>
          <div class="stat-icon">&#9830;</div>
        </div>
        <div class="stat-value" id="statLoss">0.02<span style="font-size:16px;color:var(--text-muted)">%</span></div>
        <div class="stat-footer trend-down">&#9660; 较上周 -0.01%</div>
      </div>
      <div class="stat-card red animate-in delay-4">
        <div class="stat-header">
          <span class="stat-label">活跃告警</span>
          <div class="stat-icon">&#9888;</div>
        </div>
        <div class="stat-value" id="statAlerts">7</div>
        <div class="stat-footer trend-down" style="color:var(--accent-green)">&#9660; 已处理 12 条</div>
      </div>
    </div>

    <!-- 图表区域 -->
    <div class="charts-grid">
      <!-- 延迟趋势图 -->
      <div class="card animate-in delay-3">
        <div class="card-header">
          <span class="card-title">延迟趋势（实时）</span>
          <div class="card-actions">
            <button class="card-tab active">1H</button>
            <button class="card-tab">6H</button>
            <button class="card-tab">24H</button>
            <button class="card-tab">7D</button>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="latencyChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 拓扑图 -->
      <div class="card animate-in delay-4">
        <div class="card-header">
          <span class="card-title">网络拓扑</span>
          <div class="card-actions">
            <button class="card-tab active">DC间</button>
            <button class="card-tab">区域内</button>
          </div>
        </div>
        <div class="card-body">
          <div class="topology-container">
            <canvas id="topologyCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部：表格 + 告警 -->
    <div class="bottom-grid">
      <!-- 节点列表 -->
      <div class="card animate-in delay-4">
        <div class="card-header">
          <span class="card-title">节点状态列表</span>
          <div class="card-actions">
            <button class="card-tab active">全部</button>
            <button class="card-tab">异常</button>
            <button class="card-tab">离线</button>
          </div>
        </div>
        <div class="card-body" style="padding:0;overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>节点名称</th><th>状态</th><th>平均延迟</th>
                <th>丢包率</th><th>所在区域</th><th>最后心跳</th>
              </tr>
            </thead>
            <tbody id="nodeTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 告警面板 -->
      <div class="card animate-in delay-5">
        <div class="card-header">
          <span class="card-title">最新告警</span>
          <button class="btn btn-outline" style="padding:5px 12px;font-size:12px;">查看全部</button>
        </div>
        <div class="alert-list" id="alertList"></div>
      </div>
    </div>

  </main>
</div><!-- /main -->

</div><!-- /app -->

<script>
// ============================================================
//  模拟数据
// ============================================================
const DC_REGIONS = ['北京-亦庄', '上海-张江', '深圳-南山', '杭州-未来科技城', '广州-琶洲', '成都-高新'];
const NODE_NAMES = [
  'dc-bj-sw-01','dc-bj-sw-02','dc-bj-srv-03','dc-bj-srv-04',
  'dc-sh-sw-01','dc-sh-sw-02','dc-sh-srv-03','dc-sh-srv-05',
  'dc-sz-sw-01','dc-sz-sw-03','dc-sz-srv-02','dc-sz-srv-06',
  'dc-hz-sw-01','dc-hz-srv-01','dc-gz-sw-01','cd-gz-srv-02'
];
const ALERTS = [
  { severity:'critical', title:'北京→上海链路延迟超标', desc:'当前延迟 12.8ms，阈值 5ms，持续 8 分钟', time:'2分钟前' },
  { severity:'warning',  title:'深圳 dc-sz-sw-03 丢包率升高', desc:'丢包率 0.45%，超过警告阈值 0.3%', time:'5分钟前' },
  { severity:'critical', title:'广州 dc-gz-srv-02 心跳超时', desc:'最后心跳于 3 分钟前，可能已离线', time:'8分钟前' },
  { severity:'info',     title:'新增探针 dc-hz-srv-01 上线', desc:'探针已成功注册并开始采集数据', time:'15分钟前' },
  { severity:'warning',  title:'杭州→北京抖动异常', desc:'抖动值 2.1ms，高于基线 300%', time:'22分钟前' },
  { severity:'info',     title:'例行巡检完成', desc:'全部 128 个节点巡检完成，发现 3 个异常', time:'1小时前' },
];

// ============================================================
//  工具函数
// ============================================================
function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function fmtTime(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

// ============================================================
//  延迟趋势图表
// ============================================================
const latencyCtx=document.getElementById('latencyChart').getContext('2d');
const MAX_POINTS=60;
let latencyData=Array.from({length:MAX_POINTS},()=>rand(0.2,0.8));
let latencyLabels=Array.from({length:MAX_POINTS},(_,i)=>`${i}s`);

const gradient=latencyCtx.createLinearGradient(0,0,0,280);
gradient.addColorStop(0,'rgba(6,182,212,.25)');
gradient.addColorStop(1,'rgba(6,182,212,0)');

const latencyChart=new Chart(latencyCtx,{
  type:'line',
  data:{
    labels: latencyLabels,
    datasets:[{
      label:'延迟 (ms)',
      data: latencyData,
      borderColor:'#06b6d4',
      backgroundColor:gradient,
      borderWidth:2,
      fill:true,
      tension:.4,
      pointRadius:0,
      pointHoverRadius:5,
      pointHoverBackgroundColor:'#06b6d4',
      pointHoverBorderColor:'#fff',
      pointHoverBorderWidth:2,
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    interaction:{ intersect:false, mode:'index' },
    plugins:{
      legend:{ display:false },
      tooltip:{
        backgroundColor:'rgba(26,34,53,.95)',
        borderColor:'#2a3650',
        borderWidth:1,
        titleColor:'#e8ecf4',
        bodyColor:'#8b9ab8',
        padding:12,
        cornerRadius:8,
        displayColors:false,
        callbacks:{
          label:c=>`延迟: ${c.parsed.y.toFixed(3)} ms`
        }
      }
    },
    scales:{
      x:{
        grid:{ color:'rgba(30,42,63,.5)', drawBorder:false },
        ticks:{ color:'#5a6a85', font:{size:11}, maxTicksLimit:10 }
      },
      y:{
        grid:{ color:'rgba(30,42,63,.5)', drawBorder:false },
        ticks:{ color:'#5a6a85', font:{size:11}, callback:v=>v+' ms' },
        min:0,
        max:1.2
      }
    },
    animation:{ duration:300 }
  }
});

// 实时更新延迟数据
setInterval(()=>{
  latencyData.shift();
  latencyData.push(rand(0.2,0.9));
  latencyChart.update('none');
  document.getElementById('lastUpdate').textContent=fmtTime();

  // 随机更新统计数字
  const baseLat=rand(0.35,0.55);
  document.getElementById('statLatency').innerHTML=
    baseLat.toFixed(2)+'<span style="font-size:16px;color:var(--text-muted)">ms</span>';
  const loss=(rand(0.005,0.05)).toFixed(2);
  document.getElementById('statLoss').innerHTML=
    loss+'<span style="font-size:16px;color:var(--text-muted)">%</span>';
},1500);

// ============================================================
//  网络拓扑 Canvas 绘制
// ============================================================
(function initTopology(){
  const canvas=document.getElementById('topologyCanvas');
  const ctx=canvas.getContext('2d');
  let W,H,nodes=[],animFrame;

  function resize(){
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*devicePixelRatio;
    canvas.height=rect.height*devicePixelRatio;
    canvas.style.width=rect.width+'px';
    canvas.style.height=rect.height+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    W=rect.width; H=rect.height;
    buildNodes();
  }

  function buildNodes(){
    nodes=[];
    // 中心核心交换机
    nodes.push({x:W/2,y:H/2,r:22,label:'Core',type:'core',color:'#3b82f6'});
    // 周围数据中心节点
    const count=6;
    for(let i=0;i<count;i++){
      const angle=(Math.PI*2/count)*i-Math.PI/2;
      const rx=W*.36, ry=H*.38;
      nodes.push({
        x:W/2+Math.cos(angle)*rx,
        y:H/2+Math.sin(angle)*ry,
        r:16,
        label:['BJ','SH','SZ','HZ','GZ','CD'][i],
        type:'dc',
        color:i===2?'#ef4444':i===4?'#f59e0b':'#10b981',
        pulse: i===2||i===4
      });
    }
  }

  function draw(time){
    ctx.clearRect(0,0,W,H);

    // 连线
    for(let i=1;i<nodes.length;i++){
      const n=nodes[i], core=nodes[0];
      ctx.beginPath();
      ctx.moveTo(core.x,core.y);
      ctx.lineTo(n.x,n.y);
      ctx.strokeStyle=n.type==='dc'&&n.color==='#ef4444'
        ? 'rgba(239,68,68,.35)'
        : n.type==='dc'&&n.color==='#f59e0b'
          ? 'rgba(245,158,11,.25)'
          : 'rgba(59,130,246,.18)';
      ctx.lineWidth=n.pulse?2:1;
      ctx.stroke();

      // 连线上的延迟标签
      const mx=(core.x+n.x)/2, my=(core.y+n.y)/2;
      ctx.fillStyle='rgba(10,14,23,.75)';
      ctx.beginPath(); ctx.roundRect(mx-20,my-9,40,18,4); ctx.fill();
      ctx.font='11px -apple-system';
      ctx.fillStyle=n.color;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText((rand(0.5,15)).toFixed(1)+'ms',mx,my);
    }

    // 节点
    for(const n of nodes){
      // 光晕
      if(n.pulse){
        const glowR=n.r+8+Math.sin(time/400)*4;
        const glow=ctx.createRadialGradient(n.x,n.y,n.r,n.x,n.y,glowR);
        glow.addColorStop(0,n.color+'40');
        glow.addColorStop(1,n.color+'00');
        ctx.beginPath(); ctx.arc(n.x,n.y,glowR,0,Math.PI*2);
        ctx.fillStyle=glow; ctx.fill();
      }
      // 外圈
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+3,0,Math.PI*2);
      ctx.fillStyle=(n.color||'#3b82f6')+'18';
      ctx.fill();
      // 实心圆
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.color||'#3b82f6';
      ctx.fill();
      // 标签
      ctx.font=`${n.type==='core'?700:600} ${n.type==='core'?13:11}px -apple-system`;
      ctx.fillStyle='#e8ecf4';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(n.label,n.x,n.y);
    }

    animFrame=requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize',resize);
  draw(0);
})();

// ============================================================
//  节点表格渲染
// ============================================================
function renderNodeTable(){
  const tbody=document.getElementById('nodeTableBody');
  tbody.innerHTML='';
  NODE_NAMES.forEach((name,i)=>{
    const statuses=['online','online','online','online','online','online','warning','offline'];
    const st=pick(statuses);
    const lat=rand(0.15,18).toFixed(2);
    const latPct=Math.min(lat/20*100,100);
    const loss=rand(0,0.8).toFixed(3);
    const lossCls=loss<0.1?'loss-low':loss<0.3?'loss-med':'loss-high';
    const region=pick(DC_REGIONS);
    const minsAgo=randInt(0,5);
    const stLabel={online:'在线',warning:'告警',offline:'离线'}[st];

    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><span class="node-name">${name}</span></td>
      <td><span class="status-dot ${st}"><span class="dot"></span>${stLabel}</span></td>
      <td>
        <div class="latency-bar">
          <span>${lat} ms</span>
          <div class="latency-bar-track">
            <div class="latency-bar-fill" style="width:${latPct}%;background:${lat>5?lat>10?'#ef4444':'#f59e0b':'#10b981'}"></div>
          </div>
        </div>
      </td>
      <td><span class="loss-tag ${lossCls}">${loss}%</span></td>
      <td><span class="region-tag">${region}</span></td>
      <td style="color:var(--text-muted)">${minsAgo===0?'刚刚':minsAgo+'分钟前'}</td>`;
    tbody.appendChild(tr);
  });
}
renderNodeTable();

// 每10秒刷新一次表格
setInterval(renderNodeTable,10000);

// ============================================================
//  告警列表渲染
// ============================================================
function renderAlerts(){
  const list=document.getElementById('alertList');
  list.innerHTML='';
  ALERTS.forEach(a=>{
    const div=document.createElement('div');
    div.className='alert-item';
    div.innerHTML=`
      <div class="alert-severity ${a.severity}"></div>
      <div class="alert-content">
        <div class="alert-title">${a.title}</div>
        <div class="alert-desc">${a.desc}</div>
        <div class="alert-time">${a.time}</div>
      </div>`;
    list.appendChild(div);
  });
}
renderAlerts();

// ============================================================
//  卡片 Tab 切换
// ============================================================
document.querySelectorAll('.card-actions').forEach(group=>{
  group.querySelectorAll('.card-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      group.querySelectorAll('.card-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
});

// 侧边导航切换
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
  });
});

// 初始化时间显示
document.getElementById('lastUpdate').textContent=fmtTime();
</script>

<script>
// 主题切换逻辑
(function(){
  const root=document.documentElement;
  const buttons=document.querySelectorAll('.theme-btn');
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    localStorage.setItem('oc-theme', theme);
    buttons.forEach(b=>b.classList.toggle('active', b.dataset.theme===theme));
  }
  buttons.forEach(b=>{
    b.addEventListener('click', ()=>applyTheme(b.dataset.theme));
  });
  const saved=localStorage.getItem('oc-theme')||'minimal';
  applyTheme(saved);
})();
</script>
</body>
</html>
